name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# El flujo comprueba el codigo; no necesita escribir en el repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - comprobaciones y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: conecta_ci
          POSTGRES_USER: conecta_test
          POSTGRES_PASSWORD: conecta_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conecta_test -d conecta_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONECTA_TEST_DB_USER: conecta_test
      CONECTA_TEST_DB_PASSWORD: conecta_test_local
      CONECTA_TEST_DB_PORT: '5432'
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-ci.txt

      - name: Comprobar configuracion de Django
        run: python manage.py check --settings=config.settings_ci

      - name: Detectar cambios de modelos sin migracion
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_ci

      # Descubre tests.py y test_*.py de todas las apps. No usa Supabase.
      - name: Ejecutar todas las pruebas del backend con cobertura
        id: pruebas-backend
        run: |
          mkdir -p reportes/cobertura
          python -m coverage run manage.py test --settings=config.settings_ci --noinput --verbosity 2 2>&1 | tee reportes/cobertura/pruebas.log

      - name: Generar reportes de cobertura
        if: ${{ always() && steps.pruebas-backend.outcome != 'skipped' && hashFiles('backend/reportes/.coverage') != '' }}
        run: |
          python -m coverage report | tee reportes/cobertura/resumen.txt
          python -m coverage html
          python -m coverage xml
          python -m coverage json
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Conservar cobertura y log del backend
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/reportes/cobertura/
          retention-days: 30
          if-no-files-found: warn

  e2e:
    name: E2E - recorridos aislados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: conecta_e2e
          POSTGRES_USER: conecta_test
          POSTGRES_PASSWORD: conecta_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conecta_test -d conecta_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONECTA_TEST_DB_USER: conecta_test
      CONECTA_TEST_DB_PASSWORD: conecta_test_local
      CONECTA_TEST_DB_PORT: '5432'
      CONECTA_E2E_DB_NAME: conecta_e2e
      E2E_PYTHON: python
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Crear carpeta temporal para archivos E2E
        run: echo "CONECTA_E2E_DIR=$(mktemp -d "$RUNNER_TEMP/conecta-e2e-XXXXXX")" >> "$GITHUB_ENV"

      - name: Migrar y preparar los datos E2E
        run: python manage.py preparar_e2e --settings=config.settings_e2e

      - name: Comprobar configuracion E2E
        run: python manage.py check --settings=config.settings_e2e

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Playwright
        working-directory: e2e
        run: npm ci

      - name: Instalar Chromium y dependencias del sistema
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Playwright inicia y detiene los servidores. Los fallos conservan el job rojo.
      - name: Ejecutar recorridos E2E aislados
        working-directory: e2e
        run: npx playwright test --config=playwright.ci.config.js

      - name: Conservar reportes y evidencias E2E
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reportes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 30
          if-no-files-found: warn

  frontend:
    name: Frontend - lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del archivo de bloqueo
        run: npm ci

      - name: Revisar codigo con ESLint
        run: npm run lint

      # Solo contiene la URL local y la clave publica de prueba de reCAPTCHA.
      - name: Preparar configuracion de ejemplo
        run: cp .env.example .env

      - name: Compilar frontend
        run: npm run build
