name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# El flujo comprueba el codigo; no necesita escribir en el repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - comprobaciones y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar configuracion de Django
        run: python manage.py check --settings=config.settings_test

      - name: Detectar cambios de modelos sin migracion
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      # Descubre tests.py y test_*.py de todas las apps. No usa Supabase.
      - name: Ejecutar todas las pruebas del backend
        run: python manage.py test --settings=config.settings_test --noinput --verbosity 2

  frontend:
    name: Frontend - lint y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del archivo de bloqueo
        run: npm ci

      - name: Revisar codigo con ESLint
        run: npm run lint

      # Solo contiene la URL local y la clave publica de prueba de reCAPTCHA.
      - name: Preparar configuracion de ejemplo
        run: cp .env.example .env

      - name: Compilar frontend
        run: npm run build
